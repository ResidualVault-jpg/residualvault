name: Deploy to Production

on:
  push:
    branches: [claude/build-ai-agent-system-e0Lfr]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.23.240.10
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -e
            DEPLOY_DIR=/home/residualvault
            # Find the actual deploy directory
            if [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR=$(find /home /var/www /opt -name "ecosystem.config.js" 2>/dev/null | head -1 | xargs dirname)
            fi
            echo "Deploying to: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git fetch origin claude/build-ai-agent-system-e0Lfr
            git checkout claude/build-ai-agent-system-e0Lfr
            git pull origin claude/build-ai-agent-system-e0Lfr
            npm install --production 2>/dev/null || true
            # Restart PM2
            PM2=$(which pm2 2>/dev/null || echo "/usr/local/bin/pm2")
            $PM2 restart rv-control 2>/dev/null || $PM2 restart all 2>/dev/null
            echo "Deploy complete"
